name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install flask==2.3.3 sqlalchemy==2.0.23 python-dateutil==2.8.2

      - name: Run unit tests
        run: |
          pip install pytest
          pytest test.py -v

      - name: Run security check with Bandit
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true

  generate-changelog:
    runs-on: ubuntu-latest
    needs: test-and-deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Нужно для доступа ко всем коммитам и тегам

      - name: Generate changelog
        run: |
          chmod +x generate_changelog.sh
          # Генерируем версию на основе количества тегов 
          TAG_COUNT=$(git tag | wc -l)
          NEW_VERSION="v1.$TAG_COUNT.0"
          ./generate_changelog.sh $NEW_VERSION

      - name: Convert changelog to HTML for Pages
        run: |
          pip install markdown
          python -c "
          import markdown
          with open('changelog.md', 'r') as f:
              md_content = f.read()
          html_content = f'''
          <!DOCTYPE html>
          <html>
          <head>
              <title>Changelog</title>
              <style>body {{ font-family: Arial, sans-serif; margin: 20px; }}</style>
          </head>
          <body>
              {markdown.markdown(md_content)}
          </body>
          </html>
          '''
          with open('docs/index.html', 'w') as f:
              f.write(html_content)
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  deploy-pages:
    runs-on: ubuntu-latest
    needs: generate-changelog
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
