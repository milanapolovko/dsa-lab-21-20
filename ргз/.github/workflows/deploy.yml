name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install flask pytest bandit

      - name: Run unit tests
        run: pytest

      - name: Run security check with Bandit
        run: bandit -r . -f json -o bandit-report.json || true

  generate-changelog:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Generate changelog
        run: |
          chmod +x generate_changelog.sh
          ./generate_changelog.sh v$(date +%Y%m%d%H%M%S)  # Auto-version with timestamp

      - name: Commit changelog
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add changelog.md
          git commit -m "Update changelog" || echo "No changes to commit"

      - name: Push changes
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: generate-changelog
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create index.html with changelog
        run: |
          echo "<!DOCTYPE html><html><head><title>Changelog</title></head><body><pre>" > docs/index.html
          cat changelog.md >> docs/index.html
          echo "</pre></body></html>" >> docs/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
