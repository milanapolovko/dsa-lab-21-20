name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Для доступа ко всей истории коммитов

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run security check
        run: bandit -r .

      - name: Create docs directory
        run: mkdir -p docs

      - name: Generate changelog
        run: |
          bash generate_changelog.sh
          echo "<html><head><title>Changelog</title></head><body><pre>$(cat changelog.md | markdown)</pre></body></html>" > docs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs  # Загружаем docs/ напрямую (без Jekyll)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
