name: CI/CD Pipeline

on:
  push:
    branches:
      - rgz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install flask flask-sqlalchemy pytest bandit python-dateutil

      - name: Run unit tests
        run: pytest --verbose 

      - name: Run security check with Bandit
        run: bandit -r . -f json -o bandit-report.json || true

  generate-changelog:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Generate changelog
        run: |
          chmod +x generate_changelog.sh
          ./generate_changelog.sh latest

      - name: Commit changelog
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add changelog.md
          git commit -m "Update changelog" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          branch: rgz

  deploy-pages:
    runs-on: ubuntu-latest
    needs: generate-changelog
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Create index.html with changelog
        run: |
          echo "<!DOCTYPE html><html><head><title>Changelog</title></head><body><pre>" > docs/index.html
          cat changelog.md >> docs/index.html  # Исправлено: docs вместо dosc
          echo "</pre></body></html>" >> docs/index.html


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3 